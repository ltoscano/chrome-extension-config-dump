<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Config Dump</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Cookie Config Dump</h1>
    <p class="description">Esporta i cookie della pagina corrente in formato JSON compatibile con Playwright</p>

    <div class="url-info">
      <strong>URL corrente:</strong>
      <div id="currentUrl" class="url-display">Caricamento...</div>
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="allDomains" />
        <span>Includi tutti i domini (non solo quello corrente)</span>
      </label>
    </div>

    <button id="dumpButton" class="dump-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Dump Config
    </button>

    <div id="status" class="status"></div>

    <div id="cookieCount" class="cookie-count"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
